server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/training_platform}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      # Ceiling shared by assignment attachments (Phase 11, capped stricter at 10MB in
      # StudentAssignmentService) and course materials (Phase 14, capped at 20MB in
      # AdminMaterialService) — set a bit above the higher of the two so the app's own clean
      # BadRequestException fires before Spring's raw multipart limit would.
      max-file-size: 25MB
      max-request-size: 25MB
  mail:
    host: ${BREVO_SMTP_HOST:smtp-relay.brevo.com}
    port: ${BREVO_SMTP_PORT:587}
    username: ${BREVO_SMTP_USERNAME:}
    password: ${BREVO_SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

management:
  endpoints:
    web:
      exposure:
        # Only health + info are exposed at all — env/beans/etc. would leak internals
        # (DB URL, JWT secret) if enabled, even behind admin auth.
        include: health,info
  endpoint:
    health:
      # Public health check for uptime monitoring shouldn't reveal component detail
      # (DB status, disk space) to unauthenticated callers.
      show-details: when-authorized
  health:
    mail:
      # Email is already best-effort everywhere in this app (EmailService swallows send
      # failures so registration never fails because of it) — an unconfigured/unreachable
      # SMTP relay shouldn't drag the whole app's health to DOWN and risk an orchestrator
      # restarting a perfectly working instance over it.
      enabled: false

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-key-change-me-in-every-real-environment-min-32-bytes}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  # Used to build links that go out in emails (student invite links) — distinct from
  # cors.allowed-origins, which can legitimately list several origins.
  frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:5173}
  admin:
    seed:
      email: ${ADMIN_SEED_EMAIL:}
      password: ${ADMIN_SEED_PASSWORD:}
      name: ${ADMIN_SEED_NAME:Administrator}
  mail:
    from: ${MAIL_FROM:no-reply@example.com}
    admin-notification-to: ${ADMIN_NOTIFICATION_EMAIL:}
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:}
    api-key: ${CLOUDINARY_API_KEY:}
    api-secret: ${CLOUDINARY_API_SECRET:}
