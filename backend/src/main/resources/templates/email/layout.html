<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="light"><title>{{title}}</title>
<style>@media only screen and (max-width:620px){.email-shell{width:100%!important}.email-pad{padding:28px 22px!important}.email-title{font-size:28px!important}.email-outer{padding:16px 8px!important}}a:focus{outline:2px solid #087f68;outline-offset:3px}</style></head>
<body style="margin:0;padding:0;background-color:#eef4f0;color:#19382d;font-family:Arial,Helvetica,sans-serif;-webkit-text-size-adjust:100%">
<div style="display:none;font-size:1px;color:#eef4f0;line-height:1px;max-height:0;max-width:0;opacity:0;overflow:hidden;mso-hide:all">{{preheader}}</div>
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" bgcolor="#eef4f0"><tr><td class="email-outer" align="center" style="padding:40px 16px">
<!--[if mso]><table role="presentation" width="600" cellspacing="0" cellpadding="0"><tr><td><![endif]-->
<table role="presentation" class="email-shell" width="100%" cellspacing="0" cellpadding="0" border="0" style="max-width:600px;border:1px solid #d9e5dd;border-radius:20px;overflow:hidden;background-color:#ffffff" bgcolor="#ffffff">
<tr><td class="email-pad" bgcolor="#103f32" style="padding:32px 40px;background-color:#103f32;border-radius:20px 20px 0 0">
<table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:0 0 28px"><tr>
<td width="34" height="34" bgcolor="#ffffff" style="width:34px;height:34px;background-color:#ffffff;border-radius:9px" valign="middle" align="center"><img src="https://res.cloudinary.com/fyretnzm/image/upload/v1788956209/brand/bukiva-learn-icon.png" width="24" height="24" alt="" style="display:block;border:0"></td>
<td style="padding-left:10px;color:#ffffff;font-size:23px;font-weight:bold;letter-spacing:-1px" valign="middle">Bukiva Learn<span style="color:#75dfb5">.</span></td>
</tr></table>
<p style="margin:0 0 12px;font-size:11px;line-height:18px;font-weight:bold;letter-spacing:2px;color:#9ce5c6">{{eyebrow}}</p>
<h1 class="email-title" style="margin:0;color:#ffffff;font-size:34px;line-height:1.2;letter-spacing:-1px">{{title}}</h1>
</td></tr>
<tr><td class="email-pad" style="padding:34px 40px;color:#19382d;font-size:16px;line-height:1.7">
<p style="margin:0 0 16px;font-weight:bold">{{greeting}}</p>
<p style="margin:0 0 24px;color:#526b60">{{intro}}</p>
{{details}}
{{note}}
{{action}}
<p style="margin:28px 0 0;color:#526b60;font-size:14px">Keep learning. Keep building.<br><strong style="color:#19382d">The Bukiva Learn team</strong></p>
</td></tr>
<tr><td class="email-pad" bgcolor="#f6f9f7" style="padding:24px 40px;border-top:1px solid #e0e9e3;color:#61766b;font-size:12px;line-height:1.7">{{footer}}<p style="margin:12px 0 0;font-weight:bold;color:#19382d">Build the skills. Make the leap.</p></td></tr>
</table>
<!--[if mso]></td></tr></table><![endif]-->
</td></tr></table></body></html>
